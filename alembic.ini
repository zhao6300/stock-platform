[alembic]
script_location = src/stock_platform/infrastructure/sqlite/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite:///./stock_platform.sqlite3

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
